    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f2ed}#app{width:100%;height:100%;display:flex;flex-direction:column}.top{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#a30d18;color:#fff;font:600 12px -apple-system,BlinkMacSystemFont,"Noto Sans Thai",sans-serif}.open{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.55);padding:4px 8px;border-radius:999px}.frame{border:0;flex:1;width:100%;min-height:0;background:#fff}

<body>
  <div id="app">
    <div class="top"><span id="label">Register Pavilion</span><a id="open" class="open" target="_blank" rel="noopener">เปิดเต็มหน้า</a></div>

  <script>
    const APP='https://script.google.com/macros/s/AKfycbwctlJZgrjyXUghLs_FuS7JvRH5X5ySotRJOO8TNpsZcIS62PVDrHACs4GaFbfDnjsmgg/exec';
    const params=new URLSearchParams(location.search);
    const admin=params.get('view')==='admin';
    const target=APP+(location.search||'');
    document.title=admin?'Admin Pavilion':'Register Pavilion';
    document.getElementById('label').textContent=document.title;
    document.getElementById('open').href=target;
    document.getElementById('appFrame').src=target;
